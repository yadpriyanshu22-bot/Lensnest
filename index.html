<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensNest | Discover Images</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="hero">
    <a href="#" class="logo" aria-label="LensNest home">
      LensNest<span class="logo-leaf"></span>
    </a>

    <p class="tagline">Find images that bring your ideas to life.</p>

    <form id="search-form">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
      </span>

      <label class="visually-hidden" for="search-input">
        Search for images
      </label>

      <input
        type="search"
        id="search-input"
        placeholder="Search images..."
        autocomplete="off"
      >

      <button type="submit" id="search-button">Search</button>
    </form>

    <nav class="categories" aria-label="Image categories">
      <button type="button" data-query="nature">Nature</button>
      <button type="button" data-query="travel">Travel</button>
      <button type="button" data-query="architecture">Architecture</button>
      <button type="button" data-query="animals">Animals</button>
    </nav>
  </header>

  <main>
    <h1 class="section-title">Discover Images</h1>

    <p id="status" aria-live="polite">
      Explore beautiful images or search for something you love.
    </p>

    <section id="results" class="gallery" aria-label="Image results"></section>
  </main>

  <footer>
    <p>Made with care by LensNest❤️</p>
  </footer>

</body>
</html>
